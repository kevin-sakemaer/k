name: review-gate

# pull_request_target runs this workflow and its script as defined on the base
# branch, so a PR cannot change the gate that checks it (#15). Never check out
# or run code from the PR head here.
# No branches filter: the gate must run on PRs to any base, so that it fails
# stacked PRs (#33). `edited` re-runs it when the base is changed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft, edited]

permissions: {}

# Each synchronize or reopened run gets its own group (github.run_id), so no
# later event can cancel or replace it while it is pending: the push removes
# review:approved unless the PR patch is unchanged (same-patch rule, #52).
# Label and draft-state runs (ready_for_review, converted_to_draft) share one
# group per PR; they read the current draft state from the API. A pending run
# in a group can still be replaced by a newer one, so the freshness check below
# does not rely on this setting.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}-${{ (github.event.action == 'synchronize' || github.event.action == 'reopened') && github.run_id || 'label' }}
  cancel-in-progress: false

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is the tip of the base branch under pull_request_target,
          # so workflow and scripts come from the same commit, never the PR head.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check review labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: bash .github/scripts/review_gate.sh
