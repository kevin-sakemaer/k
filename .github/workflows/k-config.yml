name: k-config

# Required check on main (ruleset 25458936). It validates k.yaml, as the
# `test` job does through tool/check.sh, and adds the job summary.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: k-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  k-config:
    name: k-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5
      - name: Cache the pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get --enforce-lockfile
      - name: Test the config tool
        working-directory: packages/k_config
        run: dart test
      - name: Validate k.yaml
        run: dart run packages/k_config/bin/k_config.dart
