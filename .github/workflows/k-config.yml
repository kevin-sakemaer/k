name: k-config

# Not yet a required check on main: k.dart Lead adds `k-config` to the
# required checks of the main ruleset once this workflow is merged.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: k-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  k-config:
    name: k-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - name: Test the config tool
        working-directory: packages/k_config
        run: dart test
      - name: Validate k.yaml
        run: dart run packages/k_config/bin/k_config.dart
