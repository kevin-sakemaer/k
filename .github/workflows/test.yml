name: test

on:
  pull_request:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Dart project
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "dart=true" >> "$GITHUB_OUTPUT"
          else
            echo "dart=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml: nothing to check."
          fi
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: steps.detect.outputs.dart == 'true'
        with:
          sdk: 3.13.5
      - if: steps.detect.outputs.dart == 'true'
        run: dart pub get
      - if: steps.detect.outputs.dart == 'true'
        run: dart format --output=none --set-exit-if-changed .
      - if: steps.detect.outputs.dart == 'true'
        run: dart analyze --fatal-infos
      - name: Require tests
        if: steps.detect.outputs.dart == 'true'
        run: |
          if [ -z "$(find test -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "::error::pubspec.yaml exists but no tests were found in test/"
            exit 1
          fi
      - if: steps.detect.outputs.dart == 'true'
        run: dart test
