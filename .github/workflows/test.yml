name: test

on:
  pull_request:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5
      - name: Run tool/check.sh (single source of checks)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tool/check.sh
      - name: Upload the lcov reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ github.event.pull_request.number }}-${{ github.sha }}
          # tool/check.sh writes one lcov.info per package under .dart_tool.
          path: .dart_tool/k_check/*/lcov.info
          include-hidden-files: true
          # A run that fails before the coverage step has no report.
          if-no-files-found: warn
          retention-days: 14
