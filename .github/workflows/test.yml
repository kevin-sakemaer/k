name: test

on:
  pull_request:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5
      - name: Cache the pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Run tool/check.sh (single source of checks)
        shell: bash
        run: bash tool/check.sh
      - name: Upload the lcov reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ github.event.pull_request.number }}-${{ github.sha }}
          # tool/check.sh writes one lcov.info per package under .dart_tool.
          path: .dart_tool/k_check/*/lcov.info
          include-hidden-files: true
          # #5 requires the reports: a successful run that has none fails.
          # A run that already failed (maybe before coverage) only warns.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 14
