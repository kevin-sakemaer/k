linter:
  rules:
    # Not listed: rules marked Deprecated on dart.dev. With an SDK constraint of
    # ^3.13.0 the analyzer reports `deprecated_lint` for any mention of them,
    # even `false`, and dart.dev says to remove them from analysis options:
    # - https://dart.dev/tools/linter-rules/avoid_null_checks_in_equality_operators
    #   (replaced by the non_nullable_equals_parameter warning)
    # - https://dart.dev/tools/linter-rules/avoid_private_typedef_functions
    #   (deprecated as of Dart 3.13)
    # - https://dart.dev/tools/linter-rules/one_member_abstracts
    #   (deprecated as of Dart 3.13)
    # - https://dart.dev/tools/linter-rules/unnecessary_await_in_return
    # - https://dart.dev/tools/linter-rules/use_if_null_to_convert_nulls_to_bools
    # - https://dart.dev/tools/linter-rules/prefer_final_parameters
    #   (deprecated in Dart 3.11; also incompatible with avoid_final_parameters,
    #   which we keep)
    always_declare_return_types: true
    always_put_control_body_on_new_line: true
    always_put_required_named_parameters_first: true
    # Incompatible with omit_obvious_local_variable_types and avoid_types_on_closure_parameters, which we keep.
    always_specify_types: false
    always_use_package_imports: true
