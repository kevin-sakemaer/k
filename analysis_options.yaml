# Ultra-strict static analysis for the whole workspace.
#
# Every lint rule from https://dart.dev/tools/linter-rules that is available in
# the Dart SDK used by CI is listed explicitly below. Enabled rules are raised
# to `error`. Each disabled rule carries a justification comment.
# Rules removed from the SDK (for example `package_api_docs`) cannot be enabled.
# Rules newer than the SDK used by CI (Dart 3.13) are not listed yet: an unknown
# rule name is itself an analyzer warning.
# No external lints package is used.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
