# Global quality configuration of this repository.
# It is validated by packages/k_config in the required `k-config` check:
# an unknown key, a wrong type, a missing reason or an unknown package
# fails CI. See packages/k_config/README.md for the schema.
coverage:
  default: 100
  overrides: {}
dependencies:
  allowed_publishers:
    - dart.dev
    - tools.dart.dev
    - labs.dart.dev
  exceptions: {}
comments:
  exceptions: []
