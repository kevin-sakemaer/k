# Global quality configuration of this repository.
# It is validated by packages/k_config through tool/check.sh in the required
# `test` check: an unknown key, a wrong type, a missing reason or an unknown
# package fails it. tool/check.sh reads every value through
# `k_config --get <key>` and never parses this file itself.
# See AGENTS.md for the schema.
coverage:
  default: 100
  tool_version: 1.16.0
  overrides: {}
dependencies:
  exceptions: {}
  registry_timeout_seconds: 30
close_issues:
  lookback_hours: 72
comments:
  include:
    - "**.dart"
  exclude:
    - ".dart_tool/**"
    - "**/.dart_tool/**"
  exceptions: []
workflows:
  max_timeout_minutes: 20
  write_scopes:
    - workflow: auto-merge.yml
      job: auto-merge
      scope: contents
      reason: "gh pr merge --auto --squash enables auto-merge, which needs write access to the repository contents."
    - workflow: auto-merge.yml
      job: auto-merge
      scope: pull-requests
      reason: "gh pr merge --auto and --disable-auto change the auto-merge state of the pull request."
    - workflow: close-issues.yml
      job: close-issues
      scope: issues
      reason: "Comments on and closes the issues that merged PRs reference with a closing keyword."
    - workflow: github-guard.yml
      job: github-guard
      scope: pull-requests
      reason: "Removes the stale ci:github-change-approved label and posts the approved-by-rebase marker comment (#52) on the pull request."
    - workflow: review-gate.yml
      job: review-gate
      scope: pull-requests
      reason: "Removes the stale review:approved label and posts the approved-by-rebase marker comment (#52) on the pull request."
