# Global quality configuration of this repository.
# It is validated by packages/k_config in the `k-config` CI check (not yet
# a required check on main): an unknown key, a wrong type, a missing reason
# or an unknown package fails it. See AGENTS.md for the schema.
coverage:
  default: 100
  overrides: {}
dependencies:
  exceptions: {}
comments:
  exceptions: []
